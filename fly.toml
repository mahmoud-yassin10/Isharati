# Raqeeb FastAPI. Deploy from the repo root:
#   fly auth login
#   fly volumes create raqeeb_data --region fra --size 1
#   fly secrets set RAQEEB_JWT_SECRET="long-random" CORS_ORIGINS="https://YOUR-APP.vercel.app"
#   fly deploy

app = "raqeeb-api"
primary_region = "fra"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  RAQEEB_DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.http_options]
    idle_timeout = 120

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "45s"
    interval = "20s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"

[[mounts]]
  source = "raqeeb_data"
  destination = "/data"
